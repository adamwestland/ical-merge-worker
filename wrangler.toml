# ical-merge-worker
# Merges multiple iCal feeds into a single subscribable .ics endpoint.
# Supports named "views" so different people see different calendar subsets.
#
# Deploy:  npx wrangler deploy
# Dev:     npx wrangler dev
# Logs:    npx wrangler tail

name = "ical-merge"
main = "src/index.ts"
compatibility_date = "2024-12-01"

routes = [
  { pattern = "ical.adamwestland.com", custom_domain = true }
]

[[kv_namespaces]]
binding = "SETTINGS"
id = "933fa781343f4e1a91b5757cffe1d3a3"

[vars]
CACHE_TTL_SECONDS = "900"   # 15 minutes

# ─── Secrets ──────────────────────────────────────────────────────────────────
# Only truly secret values live in encrypted secrets. All other config is in KV.
# Set secrets with:
#   npx wrangler secret put FEED_URLS
#   npx wrangler secret put VIEW_TOKENS
#
# FEED_URLS format (JSON object mapping feed id → URL):
#   { "gmail": "https://...", "work": "https://...", ... }
#
# VIEW_TOKENS format (JSON object mapping view name → token):
#   { "full": "<openssl rand -hex 32>", "julie": "<openssl rand -hex 32>" }
#
# ─── KV Config Keys ──────────────────────────────────────────────────────────
# Non-secret config lives in the SETTINGS KV namespace (visible/editable in dashboard):
#   config:feeds  → [{ "id": "gmail", "name": "Gmail", "prefix": "📧" }, ...]
#   config:views  → { "full": { "feeds": ["gmail", ...], "calendarName": "..." }, ... }
#   view:<name>:feeds → [...] (per-view feed overrides from settings UI)
