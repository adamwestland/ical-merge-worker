# ical-merge-worker
# Merges multiple iCal feeds into a single subscribable .ics endpoint.
# Supports named "views" so different people see different calendar subsets.
#
# Deploy:  npx wrangler deploy
# Dev:     npx wrangler dev
# Logs:    npx wrangler tail

name = "ical-merge"
main = "src/index.ts"
compatibility_date = "2024-12-01"

routes = [
  { pattern = "ical.adamwestland.com", custom_domain = true }
]

[[kv_namespaces]]
binding = "SETTINGS"
id = "933fa781343f4e1a91b5757cffe1d3a3"

[vars]
CACHE_TTL_SECONDS = "900"   # 15 minutes

# ─── Secrets ──────────────────────────────────────────────────────────────────
# CALENDAR_FEEDS and VIEWS are stored as encrypted Cloudflare secrets.
# Set them with:
#   npx wrangler secret put CALENDAR_FEEDS
#   npx wrangler secret put VIEWS
#
# CALENDAR_FEEDS format (JSON array):
#   [{ "id": "gmail", "name": "Gmail", "url": "https://...", "prefix": "📧" }, ...]
#
# VIEWS format (JSON object):
#   { "full": { "token": "<openssl rand -hex 32>", "feeds": ["gmail", ...], "calendarName": "..." }, ... }
